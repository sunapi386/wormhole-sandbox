<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Black Hole Sandbox</title>
<style>
  :root {
    --panel-bg: rgba(10, 12, 20, 0.72);
    --accent: #57d8ff;
    --accent-dim: #2b6a80;
    --text: #cfe6f0;
    --text-dim: #7f97a6;
    --track: #1d2634;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; width: 100%;
    background: #000; overflow: hidden;
    font-family: ui-monospace, "SF Mono", "Cascadia Mono", Menlo, Consolas, monospace;
    color: var(--text);
    -webkit-user-select: none; user-select: none;
    touch-action: none;
  }
  #glcanvas { display: block; width: 100vw; height: 100vh; cursor: grab; }
  #glcanvas.dragging { cursor: grabbing; }

  #panel {
    position: fixed; top: 14px; left: 14px;
    width: 288px; max-height: calc(100vh - 28px);
    overflow-y: auto;
    background: var(--panel-bg);
    backdrop-filter: blur(10px) saturate(1.2);
    -webkit-backdrop-filter: blur(10px) saturate(1.2);
    border: 1px solid rgba(87, 216, 255, 0.18);
    border-radius: 12px;
    padding: 14px 15px 16px;
    font-size: 12px; line-height: 1.4;
    box-shadow: 0 12px 40px rgba(0,0,0,0.55);
    transition: transform .28s ease, opacity .28s ease;
  }
  #panel.hidden { transform: translateX(-115%); opacity: 0; }
  #panel::-webkit-scrollbar { width: 8px; }
  #panel::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 4px; }

  .title { font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); margin: 0 0 2px; }
  .sub { color: var(--text-dim); font-size: 10.5px; margin: 0 0 12px; }

  .group { margin: 12px 0 4px; color: var(--text-dim); font-size: 10px; letter-spacing: .18em; text-transform: uppercase; border-top: 1px solid rgba(255,255,255,0.06); padding-top: 9px; }

  .row { margin: 9px 0; }
  .row label { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 3px; }
  .row .name { color: var(--text); }
  .row .val { color: var(--accent); font-variant-numeric: tabular-nums; }

  input[type=range] {
    -webkit-appearance: none; appearance: none;
    width: 100%; height: 4px; border-radius: 3px;
    background: var(--track); outline: none; margin: 2px 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 8px rgba(87,216,255,0.6);
    cursor: pointer; border: none;
  }
  input[type=range]::-moz-range-thumb {
    width: 14px; height: 14px; border-radius: 50%;
    background: var(--accent); border: none; cursor: pointer;
  }

  .checks { display: flex; flex-wrap: wrap; gap: 6px 14px; margin: 8px 0 2px; }
  .checks label { display: flex; align-items: center; gap: 6px; cursor: pointer; color: var(--text); }
  input[type=checkbox] { accent-color: var(--accent); width: 14px; height: 14px; cursor: pointer; }

  .btns { display: flex; gap: 7px; margin-top: 12px; flex-wrap: wrap; }
  button {
    flex: 1 1 auto; min-width: 62px;
    background: rgba(87,216,255,0.08);
    color: var(--accent);
    border: 1px solid rgba(87,216,255,0.28);
    border-radius: 7px; padding: 7px 6px;
    font-family: inherit; font-size: 11px; letter-spacing: .04em;
    cursor: pointer; transition: background .15s;
  }
  button:hover { background: rgba(87,216,255,0.18); }
  button:active { transform: translateY(1px); }

  .presets { display: flex; gap: 6px; margin: 4px 0 2px; flex-wrap: wrap; }
  .presets button { flex: 1 1 30%; font-size: 10.5px; padding: 6px 4px; }

  #hud {
    position: fixed; bottom: 12px; left: 14px;
    font-size: 11px; color: var(--text-dim);
    background: rgba(10,12,20,0.55); padding: 5px 9px; border-radius: 7px;
    pointer-events: none;
  }
  #hud b { color: var(--accent); font-weight: 500; }
  #toggle {
    position: fixed; top: 14px; left: 14px;
    z-index: 5; display: none;
    background: var(--panel-bg); color: var(--accent);
    border: 1px solid rgba(87,216,255,0.3); border-radius: 8px;
    width: 38px; height: 38px; font-size: 17px; cursor: pointer;
  }
  #panel.hidden ~ #toggle { display: block; }
  #err {
    position: fixed; inset: 0; display: none; place-items: center;
    background: #000; color: #ff7a7a; font-size: 13px; padding: 30px; text-align: center;
  }
  a { color: var(--accent); }
</style>
</head>
<body>
<canvas id="glcanvas"></canvas>
<button id="toggle" title="Show controls">☰</button>

<div id="panel">
  <div class="title">Black Hole Sandbox</div>
  <div class="sub">Geodesic ray-marching in curved space. Drag to orbit · scroll to zoom.</div>

  <div class="presets">
    <button data-preset="interstellar">Interstellar</button>
    <button data-preset="plasma">Blue Plasma</button>
    <button data-preset="pure">Pure Lens</button>
  </div>

  <div class="group">Gravity &amp; camera</div>
  <div class="row" data-slider="gravity"></div>
  <div class="row" data-slider="distance"></div>
  <div class="row" data-slider="pitch"></div>
  <div class="row" data-slider="fov"></div>

  <div class="group">Accretion disk</div>
  <div class="row" data-slider="diskInner"></div>
  <div class="row" data-slider="diskOuter"></div>
  <div class="row" data-slider="diskThickness"></div>
  <div class="row" data-slider="diskBright"></div>
  <div class="row" data-slider="spin"></div>
  <div class="row" data-slider="doppler"></div>
  <div class="row" data-slider="color"></div>

  <div class="group">Sky &amp; render</div>
  <div class="row" data-slider="starBright"></div>
  <div class="row" data-slider="quality"></div>
  <div class="row" data-slider="resScale"></div>

  <div class="checks">
    <label><input type="checkbox" id="chkDisk" checked> Disk</label>
    <label><input type="checkbox" id="chkOrbit"> Auto-orbit</label>
    <label><input type="checkbox" id="chkPause"> Pause</label>
  </div>

  <div class="btns">
    <button id="btnReset">Reset</button>
    <button id="btnShot">Screenshot</button>
    <button id="btnHide">Hide ‹</button>
  </div>
</div>

<div id="hud"><b id="fps">·</b> fps · <span id="resTxt"></span></div>
<div id="err"></div>

<!-- ============================ vertex shader ============================ -->
<script id="vs" type="x-shader/x-vertex">
attribute vec2 aPos;
void main() { gl_Position = vec4(aPos, 0.0, 1.0); }
</script>

<!-- =========================== fragment shader =========================== -->
<script id="fs" type="x-shader/x-fragment">
precision highp float;

#define MAX_STEPS 360
#define PI 3.14159265

uniform vec2  uResolution;
uniform float uTime;
uniform vec3  uCamPos;
uniform vec3  uCamRight;
uniform vec3  uCamUp;
uniform vec3  uCamFwd;
uniform float uFov;         // full vertical fov, radians

uniform float uGravity;     // lensing strength multiplier (0 = flat space)
uniform float uDiskInner;
uniform float uDiskOuter;
uniform float uDiskThickness;
uniform float uDiskBright;
uniform float uSpin;
uniform float uDoppler;
uniform float uColor;       // 0 = fire, 1 = blue plasma
uniform float uStarBright;
uniform float uStepScale;   // quality: smaller = finer steps
uniform float uDiskOn;      // 1 or 0

// ---------------------------------------------------------------- hashes
float hash21(vec2 p){
  p = fract(p * vec2(123.34, 345.45));
  p += dot(p, p + 34.345);
  return fract(p.x * p.y);
}
float vnoise(vec2 p){
  vec2 i = floor(p), f = fract(p);
  f = f * f * (3.0 - 2.0 * f);
  float a = hash21(i);
  float b = hash21(i + vec2(1.0, 0.0));
  float c = hash21(i + vec2(0.0, 1.0));
  float d = hash21(i + vec2(1.0, 1.0));
  return mix(mix(a, b, f.x), mix(c, d, f.x), f.y);
}
float fbm(vec2 p){
  float v = 0.0, amp = 0.5;
  for (int k = 0; k < 4; k++){ v += amp * vnoise(p); p *= 2.03; amp *= 0.5; }
  return v;
}

// ---------------------------------------------------------------- starfield
vec3 sky(vec3 d){
  float u = atan(d.z, d.x);
  float v = asin(clamp(d.y, -1.0, 1.0));
  vec2 uv = vec2(u, v);

  // faint nebula
  float neb = fbm(uv * 2.0 + 4.0) * fbm(uv * 3.7 - 2.0);
  vec3 col = mix(vec3(0.006, 0.008, 0.016), vec3(0.09, 0.04, 0.16), neb) * neb * 1.3;
  col += vec3(0.02, 0.05, 0.09) * pow(neb, 2.0) * 0.6;

  // three star layers
  for (int L = 0; L < 3; L++){
    float sc = 70.0 + float(L) * 130.0;
    vec2 g = uv * sc;
    vec2 id = floor(g);
    vec2 f = fract(g);
    float h = hash21(id + float(L) * 41.7);
    if (h > 0.955){
      vec2 sp = vec2(hash21(id + 1.7), hash21(id + 4.3));
      float dd = length(f - sp);
      float star = smoothstep(0.14, 0.0, dd);
      float tw = 0.65 + 0.35 * sin(uTime * 2.5 + h * 120.0);
      vec3 sc2 = mix(vec3(0.65, 0.78, 1.0), vec3(1.0, 0.87, 0.62), hash21(id + 8.1));
      col += star * tw * sc2 * ((h - 0.955) / 0.045) * 1.7;
    }
  }
  return col;
}

// ---------------------------------------------------------------- disk color
vec3 diskEmission(vec3 p, float rad, vec3 photonDir){
  float tnorm = clamp((rad - uDiskInner) / max(uDiskOuter - uDiskInner, 0.001), 0.0, 1.0);

  // palettes: fire vs blue plasma, mixed by uColor
  vec3 hot  = mix(vec3(1.0, 0.94, 0.72), vec3(0.82, 0.95, 1.0), uColor);
  vec3 mid  = mix(vec3(1.0, 0.50, 0.16), vec3(0.32, 0.62, 1.0), uColor);
  vec3 cool = mix(vec3(0.62, 0.13, 0.03), vec3(0.10, 0.16, 0.55), uColor);
  vec3 base = tnorm < 0.5 ? mix(hot, mid, tnorm * 2.0)
                          : mix(mid, cool, (tnorm - 0.5) * 2.0);

  // radius-dependent brightness (inner hotter/brighter)
  float bright = pow(1.0 - tnorm, 1.6) + 0.14;

  // differential (Keplerian) rotation -> spiral shear, seam-free
  float rot = uTime * uSpin * pow(rad, -1.5) * 6.0;
  float ca = cos(rot), sa = sin(rot);
  vec2 q = mat2(ca, -sa, sa, ca) * p.xz;
  float swirl = fbm(q * 1.6) * 0.6 + fbm(q * 5.2) * 0.4;
  float bands = 0.5 + 0.5 * sin(rad * 7.5 - rot * 0.6 + swirl * 7.0);
  float tex = mix(0.18, 1.5, swirl) * mix(0.6, 1.0, bands);

  // relativistic Doppler beaming (prograde disk)
  vec3 orbit = normalize(vec3(-p.z, 0.0, p.x));
  float beam = 1.0 + uDoppler * dot(orbit, normalize(photonDir));
  beam = clamp(beam, 0.15, 2.6);
  vec3 doppTint = mix(vec3(1.0), vec3(0.7, 0.85, 1.25), clamp((beam - 1.0), 0.0, 1.0));

  return base * bright * tex * pow(beam, 2.2) * doppTint;
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * uResolution) / uResolution.y;
  float t = tan(uFov * 0.5);
  vec3 dir = normalize(uCamFwd + uv.x * t * uCamRight + uv.y * t * uCamUp);

  vec3 pos = uCamPos;
  vec3 vel = dir;

  // conserved angular-momentum-squared for the Schwarzschild photon eqn (rs = 1)
  float h2 = dot(cross(pos, dir), cross(pos, dir));

  float escapeR = length(uCamPos) + 42.0;
  vec3 col = vec3(0.0);
  float transmit = 1.0;
  bool captured = false;

  for (int i = 0; i < MAX_STEPS; i++){
    float r = length(pos);

    // adaptive step: fine near the hole/disk, coarse far away
    float dt = uStepScale * (0.045 * r + 0.02);
    if (r < uDiskOuter + 2.5) dt = min(dt, uStepScale * 0.09 + 0.015);

    // gravitational acceleration toward the singularity (rs = 1)
    vec3 acc = -1.5 * uGravity * h2 * pos / pow(dot(pos, pos), 2.5);

    vel += acc * dt;
    pos += vel * dt;
    r = length(pos);

    if (r < 1.0) { captured = true; break; }   // event horizon

    // volumetric emissive disk in the equatorial (xz) plane
    if (uDiskOn > 0.5){
      float rad = length(pos.xz);
      if (rad > uDiskInner - 0.3 && rad < uDiskOuter + 0.3 && abs(pos.y) < uDiskThickness){
        float hfall = 1.0 - clamp(abs(pos.y) / uDiskThickness, 0.0, 1.0);
        hfall = hfall * hfall;
        float edge = smoothstep(uDiskInner, uDiskInner + 0.35, rad)
                   * smoothstep(uDiskOuter, uDiskOuter - 1.2, rad);
        float dens = hfall * edge;
        if (dens > 0.001){
          vec3 emit = diskEmission(pos, rad, vel);
          float alpha = clamp(dens * dt * 5.5, 0.0, 1.0);
          col += transmit * emit * uDiskBright * alpha;
          transmit *= (1.0 - alpha * 0.85);
          if (transmit < 0.01) break;
        }
      }
    }

    if (r > escapeR) break;
  }

  if (!captured){
    col += transmit * sky(normalize(vel)) * uStarBright;
  }

  // tonemap + gamma for display
  col = vec3(1.0) - exp(-col * 1.15);
  col = pow(col, vec3(1.0 / 2.2));
  gl_FragColor = vec4(col, 1.0);
}
</script>

<script>
"use strict";
(function () {
  const canvas = document.getElementById("glcanvas");
  const errBox = document.getElementById("err");

  function fail(msg) {
    errBox.style.display = "grid";
    errBox.innerHTML = msg;
    throw new Error(msg);
  }

  const gl = canvas.getContext("webgl", { antialias: false, preserveDrawingBuffer: true })
          || canvas.getContext("experimental-webgl", { preserveDrawingBuffer: true });
  if (!gl) fail("WebGL is not available in this browser.");

  function compile(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src);
    gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) {
      fail("Shader compile error:<br><pre style='text-align:left'>" + gl.getShaderInfoLog(s) + "</pre>");
    }
    return s;
  }
  const prog = gl.createProgram();
  gl.attachShader(prog, compile(gl.VERTEX_SHADER, document.getElementById("vs").textContent));
  gl.attachShader(prog, compile(gl.FRAGMENT_SHADER, document.getElementById("fs").textContent));
  gl.linkProgram(prog);
  if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) fail("Link error: " + gl.getProgramInfoLog(prog));
  gl.useProgram(prog);

  // fullscreen triangle
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const aPos = gl.getAttribLocation(prog, "aPos");
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 2, gl.FLOAT, false, 0, 0);

  const U = {};
  ["uResolution","uTime","uCamPos","uCamRight","uCamUp","uCamFwd","uFov","uGravity",
   "uDiskInner","uDiskOuter","uDiskThickness","uDiskBright","uSpin","uDoppler","uColor",
   "uStarBright","uStepScale","uDiskOn"].forEach(n => U[n] = gl.getUniformLocation(prog, n));

  // ---------------------------------------------------------------- controls
  // key: [label, min, max, step, default, format]
  const SPEC = {
    gravity:       ["Lensing strength", 0.0, 3.0, 0.01, 1.0,  v => v.toFixed(2)],
    distance:      ["Camera distance",  3.0, 45.0, 0.1, 14.0, v => v.toFixed(1)],
    pitch:         ["Camera tilt",     -89, 89,    0.5, 9,    v => v.toFixed(0) + "°"],
    fov:           ["Field of view",    30, 110,   1,   62,   v => v.toFixed(0) + "°"],
    diskInner:     ["Inner radius",     1.2, 8.0,  0.05, 2.7, v => v.toFixed(2)],
    diskOuter:     ["Outer radius",     3.0, 22.0, 0.1, 10.0, v => v.toFixed(1)],
    diskThickness: ["Thickness",        0.02, 1.5, 0.01, 0.35, v => v.toFixed(2)],
    diskBright:    ["Brightness",       0.0, 4.0,  0.02, 1.1,  v => v.toFixed(2)],
    spin:          ["Spin speed",       0.0, 4.0,  0.01, 1.0,  v => v.toFixed(2)],
    doppler:       ["Doppler beaming",  0.0, 1.2,  0.01, 0.55, v => v.toFixed(2)],
    color:         ["Color (fire→ice)", 0.0, 1.0, 0.01, 0.0, v => v.toFixed(2)],
    starBright:    ["Star brightness",  0.0, 3.0,  0.02, 1.0,  v => v.toFixed(2)],
    quality:       ["Ray quality",      0.5, 2.5,  0.05, 1.0,  v => (1 / v).toFixed(2) + "x"],
    resScale:      ["Resolution",       0.4, 1.5,  0.05, 1.0,  v => Math.round(v * 100) + "%"],
  };
  const PRESETS = {
    interstellar: { gravity:1.0, color:0.0, diskInner:2.7, diskOuter:10, diskThickness:0.35, diskBright:1.1, doppler:0.55, spin:1.0, pitch:9,  fov:62, starBright:1.0 },
    plasma:       { gravity:1.2, color:1.0, diskInner:2.3, diskOuter:12, diskThickness:0.45, diskBright:1.6,  doppler:0.7,  spin:1.6, pitch:16, fov:66, starBright:0.9 },
    pure:         { gravity:1.0, diskBright:0.0, starBright:1.4, pitch:4, fov:58 },
  };

  const state = {};
  const inputs = {};
  const valEls = {};

  for (const key in SPEC) {
    const [label, mn, mx, step, def, fmt] = SPEC[key];
    state[key] = def;
    const row = document.querySelector(`[data-slider="${key}"]`);
    row.innerHTML =
      `<label><span class="name">${label}</span><span class="val"></span></label>` +
      `<input type="range" min="${mn}" max="${mx}" step="${step}">`;
    const input = row.querySelector("input");
    const valEl = row.querySelector(".val");
    input.value = def;
    valEl.textContent = fmt(def);
    input.addEventListener("input", () => {
      state[key] = parseFloat(input.value);
      valEl.textContent = fmt(state[key]);
      if (key === "resScale") resize();
    });
    inputs[key] = input;
    valEls[key] = valEl;
  }
  function setSlider(key, v) {
    state[key] = v;
    inputs[key].value = v;
    valEls[key].textContent = SPEC[key][5](v);
  }

  // camera orbit state (yaw/pitch driven by drag, distance by slider/wheel)
  let yaw = 0.5;
  const chkDisk = document.getElementById("chkDisk");
  const chkOrbit = document.getElementById("chkOrbit");
  const chkPause = document.getElementById("chkPause");

  // ---------------------------------------------------------------- interaction
  let dragging = false, lastX = 0, lastY = 0;
  canvas.addEventListener("pointerdown", e => {
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    canvas.classList.add("dragging"); canvas.setPointerCapture(e.pointerId);
  });
  canvas.addEventListener("pointermove", e => {
    if (!dragging) return;
    yaw -= (e.clientX - lastX) * 0.006;
    let p = state.pitch - (e.clientY - lastY) * 0.35;
    setSlider("pitch", Math.max(-89, Math.min(89, p)));
    lastX = e.clientX; lastY = e.clientY;
  });
  function endDrag() { dragging = false; canvas.classList.remove("dragging"); }
  canvas.addEventListener("pointerup", endDrag);
  canvas.addEventListener("pointercancel", endDrag);
  canvas.addEventListener("wheel", e => {
    e.preventDefault();
    let d = state.distance * (1 + Math.sign(e.deltaY) * 0.08);
    setSlider("distance", Math.max(3, Math.min(45, d)));
  }, { passive: false });

  // buttons
  const panel = document.getElementById("panel");
  document.getElementById("btnHide").onclick = () => panel.classList.add("hidden");
  document.getElementById("toggle").onclick = () => panel.classList.remove("hidden");
  document.getElementById("btnReset").onclick = () => { applyPreset("interstellar"); yaw = 0.5; };
  document.getElementById("btnShot").onclick = () => {
    renderFrame(performance.now()); // ensure buffer is fresh
    const a = document.createElement("a");
    a.download = "blackhole.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
  document.querySelectorAll("[data-preset]").forEach(b =>
    b.onclick = () => applyPreset(b.dataset.preset));
  function applyPreset(name) {
    const p = PRESETS[name];
    for (const k in p) if (k in SPEC) setSlider(k, p[k]);
  }
  window.addEventListener("keydown", e => {
    if (e.key === " ") { chkPause.checked = !chkPause.checked; e.preventDefault(); }
    else if (e.key.toLowerCase() === "h") panel.classList.toggle("hidden");
  });

  // ---------------------------------------------------------------- sizing
  const resTxt = document.getElementById("resTxt");
  function resize() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const s = state.resScale * dpr;
    const w = Math.max(1, Math.floor(window.innerWidth * s));
    const h = Math.max(1, Math.floor(window.innerHeight * s));
    if (canvas.width !== w || canvas.height !== h) {
      canvas.width = w; canvas.height = h;
    }
    gl.viewport(0, 0, w, h);
    resTxt.textContent = w + "×" + h;
  }
  window.addEventListener("resize", resize);
  resize();

  // ---------------------------------------------------------------- render
  let simTime = 0, lastNow = performance.now();
  let fpsAccum = 0, fpsCount = 0, fpsShown = performance.now();
  const fpsEl = document.getElementById("fps");

  function renderFrame(now) {
    const dt = Math.min((now - lastNow) / 1000, 0.05);
    lastNow = now;
    if (!chkPause.checked) simTime += dt;
    if (chkOrbit.checked && !dragging) yaw += dt * 0.15;

    const dist = state.distance;
    const pitch = state.pitch * Math.PI / 180;
    const cp = Math.cos(pitch), sp = Math.sin(pitch);
    const camPos = [dist * cp * Math.cos(yaw), dist * sp, dist * cp * Math.sin(yaw)];

    // look at origin
    const fwd = norm([-camPos[0], -camPos[1], -camPos[2]]);
    let right = cross(fwd, [0, 1, 0]);
    if (len(right) < 1e-4) right = [1, 0, 0]; // near-vertical guard
    right = norm(right);
    const up = cross(right, fwd);

    gl.uniform2f(U.uResolution, canvas.width, canvas.height);
    gl.uniform1f(U.uTime, simTime);
    gl.uniform3fv(U.uCamPos, camPos);
    gl.uniform3fv(U.uCamRight, right);
    gl.uniform3fv(U.uCamUp, up);
    gl.uniform3fv(U.uCamFwd, fwd);
    gl.uniform1f(U.uFov, state.fov * Math.PI / 180);
    gl.uniform1f(U.uGravity, state.gravity);
    gl.uniform1f(U.uDiskInner, state.diskInner);
    gl.uniform1f(U.uDiskOuter, Math.max(state.diskOuter, state.diskInner + 0.5));
    gl.uniform1f(U.uDiskThickness, state.diskThickness);
    gl.uniform1f(U.uDiskBright, state.diskBright);
    gl.uniform1f(U.uSpin, state.spin);
    gl.uniform1f(U.uDoppler, state.doppler);
    gl.uniform1f(U.uColor, state.color);
    gl.uniform1f(U.uStarBright, state.starBright);
    gl.uniform1f(U.uStepScale, state.quality);
    gl.uniform1f(U.uDiskOn, chkDisk.checked ? 1 : 0);

    gl.drawArrays(gl.TRIANGLES, 0, 3);
  }

  function loop(now) {
    renderFrame(now);
    const inst = 1000 / Math.max(now - (loop._p || now), 0.001);
    loop._p = now;
    fpsAccum += inst; fpsCount++;
    if (now - fpsShown > 400) {
      fpsEl.textContent = Math.round(fpsAccum / fpsCount);
      fpsAccum = 0; fpsCount = 0; fpsShown = now;
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(loop);

  // vec helpers
  function cross(a, b) { return [a[1]*b[2]-a[2]*b[1], a[2]*b[0]-a[0]*b[2], a[0]*b[1]-a[1]*b[0]]; }
  function len(a) { return Math.hypot(a[0], a[1], a[2]); }
  function norm(a) { const l = len(a) || 1; return [a[0]/l, a[1]/l, a[2]/l]; }
})();
</script>
